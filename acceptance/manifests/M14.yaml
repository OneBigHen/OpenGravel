id: M14
feature: M14-ride-continuity.feature
priority: P0
executors:
  chromium:
    kind: playwright
    spec: null
  webkit:
    kind: playwright
    spec: null
  iphone:
    kind: maestro
    flow: ".maestro/M14-resume-ride.yaml"
  ipad:
    kind: maestro
    flow: ".maestro/M14-resume-ride.yaml"
preflight:
  require_matching_sha: true
  require_real_device_session: true
  prohibit_desktop_fallback: true
evidence:
  screenshot: on_failure
  video: on_failure
  trace: on_failure
  console: always
  network_errors: always
exploratory:
  enabled: true
  model_tier: cheap
