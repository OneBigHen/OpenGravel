id: M11
feature: M11-plan-and-start.feature
priority: P0
executors:
  chromium:
    kind: playwright
    spec: "tests/e2e/critical/ride-focus.spec.ts"
  webkit:
    kind: playwright
    spec: "tests/e2e/critical/ride-focus.spec.ts"
  iphone:
    kind: maestro
    flow: ".maestro/M11-plan-and-start.yaml"
  ipad:
    kind: maestro
    flow: ".maestro/M11-plan-and-start.yaml"
preflight:
  require_matching_sha: true
  require_real_device_session: true
  prohibit_desktop_fallback: true
evidence:
  screenshot: on_failure
  video: on_failure
  trace: on_failure
  console: always
  network_errors: always
exploratory:
  enabled: true
  model_tier: cheap
