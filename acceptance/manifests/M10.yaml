id: M10
feature: M10-prepare.feature
priority: P1
executors:
  chromium:
    kind: playwright
    spec:
      - tests/e2e/critical/prepare.spec.ts
      - tests/e2e/critical/weather.spec.ts
      - tests/e2e/critical/traffic.spec.ts
  webkit:
    kind: playwright
    spec:
      - tests/e2e/critical/prepare.spec.ts
      - tests/e2e/critical/weather.spec.ts
      - tests/e2e/critical/traffic.spec.ts
  iphone:
    kind: maestro
    flow: ".maestro/M10-prepare.yaml"
  ipad:
    kind: maestro
    flow: ".maestro/M10-prepare.yaml"
preflight:
  require_matching_sha: true
  require_real_device_session: true
  prohibit_desktop_fallback: true
evidence:
  screenshot: on_failure
  video: on_failure
  trace: on_failure
  console: always
  network_errors: always
exploratory:
  enabled: true
  model_tier: cheap
