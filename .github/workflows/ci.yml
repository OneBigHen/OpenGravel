name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: lint / typecheck / test / architecture / build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Environment contract
        run: npm run audit:env

      - name: Lint
        run: npm run lint

      - name: CSS budget
        run: npm run css:budget

      - name: Typecheck
        run: npm run typecheck

      - name: Unit / integration / contract tests
        run: npm test

      - name: Ride simulation
        run: npm run ride-sim

      - name: Architecture tests
        run: npm run test:architecture

      - name: Build
        run: npm run build

  e2e-critical-shard:
    name: critical browser tests shard ${{ matrix.shard }}/4
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Critical browser tests
        run: npx playwright test --project=critical-chromium --retries=1 --shard=${{ matrix.shard }}/4

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # One result under the old name, so tools that wait for "critical browser tests (Chromium)" keep working.
  e2e-critical:
    name: critical browser tests (Chromium)
    if: always() && github.event_name == 'pull_request'
    needs: e2e-critical-shard
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: test "${{ needs.e2e-critical-shard.result }}" = "success"
