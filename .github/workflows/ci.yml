name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: lint / typecheck / test / architecture / build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Environment contract
        run: npm run audit:env

      - name: Lint
        run: npm run lint

      - name: CSS budget
        run: npm run css:budget

      - name: Typecheck
        run: npm run typecheck

      - name: Unit / integration / contract tests
        run: npm test

      - name: Ride simulation
        run: npm run ride-sim

      - name: Architecture tests
        run: npm run test:architecture

      - name: Build
        run: npm run build

  e2e-critical:
    name: critical browser tests (Chromium)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Critical browser tests
        run: npx playwright test --project=critical-chromium --retries=1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
