# M14 — ride continuity: resume a ride midway (iOS).
# The proposal's example mission. Plans a ride, starts it, pauses, relaunches
# the app (state kept), and resumes — navigation must continue from the
# rider's current position, never route back to the start.
#
# Same simulator-GPS precondition as M12.
appId: org.onebighen.opengravel
name: M14 resume ride midway
properties:
  missionId: "M14"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Where to, or describe a ride"
    timeout: 45000
- tapOn: "Where to, or describe a ride"
- inputText: "Phoenixville"
- extendedWaitUntil:
    visible: "Phoenixville.*"
    timeout: 20000
- pressKey: Enter
- tapOn: "Create ride"
- extendedWaitUntil:
    visible: "Ride ready.*"
    timeout: 60000
- tapOn: "Start ride"
- extendedWaitUntil:
    visible: ".*GPS.*"
    timeout: 30000
- takeScreenshot: 01-riding
# Pause, then relaunch the app WITHOUT clearing state: the paused ride must
# be restored, not restarted.
- tapOn: "Pause"
- extendedWaitUntil:
    visible: "Paused"
    timeout: 15000
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Paused"
    timeout: 45000
- takeScreenshot: 02-restored
- tapOn: "Resume"
- extendedWaitUntil:
    visible: ".*GPS.*"
    timeout: 30000
- takeScreenshot: 03-resumed-midway
