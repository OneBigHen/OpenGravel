# M01 — plan a first route (iOS).
# Plans a route with an explicit start and destination from the planner's
# search fields, then verifies a route is visible and selectable by tapping
# the "Best Ride" route card. It stops at the plan: starting the ride is
# M11's lane.
#
# UI grounding (current, not the pre-rework copy the older flows use): the
# sheet head always shows the status line ("No plan yet." when idle); the
# start search field carries the "Starting point" placeholder and the
# destination field "Where to, or a ride idea". After planning, the sheet
# handle reads "Compare rides" (or "Ride choices" with a single candidate);
# tapping it reveals the route cards. A place-like query ("Pottstown") only
# offers place suggestions, never the ride-advisor describe option, so Enter
# picks the place.
#
# The in-flight cancel scenario stays in the Playwright lane
# (tests/e2e/critical/first-route.spec.ts): the plan window is too tight for
# a deterministic Maestro tap, so a cancel tap here would be a race, not a
# test.
appId: org.onebighen.opengravel
name: M01 plan a first route
properties:
  missionId: "M01"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "No plan yet."
    timeout: 45000
- takeScreenshot: 01-first-screen
- tapOn: "Starting point"
- inputText: "Phoenixville"
- extendedWaitUntil:
    visible: "Phoenixville.*"
    timeout: 20000
- takeScreenshot: 02-start-search
- pressKey: Enter
- tapOn: "Where to, or a ride idea"
- inputText: "Pottstown"
- extendedWaitUntil:
    visible: "Pottstown.*"
    timeout: 20000
- takeScreenshot: 03-destination-search
- pressKey: Enter
- tapOn: "Create ride"
- extendedWaitUntil:
    visible: "Ride ready.*"
    timeout: 60000
- takeScreenshot: 04-ride-ready
- tapOn: "Compare rides|Ride choices"
- extendedWaitUntil:
    visible: "Best Ride"
    timeout: 30000
- tapOn: "Best Ride"
- takeScreenshot: 05-route-selected
